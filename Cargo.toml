[package]
name = "ox-sse-proxy"
version = "0.1.0"
edition = "2021"
description = "Local HTTP/SSE proxy that adapts Codex Responses API traffic to OpenCode Zen/Go chat-completions gateways"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ZhongGheart/ox-sse-proxy"
keywords = ["codex", "sse", "proxy", "axum", "openai"]
categories = ["network-programming", "web-programming::http-server"]
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["http2"] }
futures-util = "0.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
